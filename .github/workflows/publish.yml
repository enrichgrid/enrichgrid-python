# Publishes to PyPI when a version tag (v*) is pushed, using PyPI Trusted Publishing (no API token stored).
# One-time setup on pypi.org: Publishing → add a pending publisher: project "enrichgrid",
# owner "enrichgrid", repository "enrichgrid-python", workflow "publish.yml", environment "pypi".
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install requests build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
